<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国志 · 九州涂色 · 游戏馆</title>
    <meta
      name="description"
      content="致敬《三国志14》的网页战略：46都市、地区涂色、武将五维与个性。自研地图与数据，非光荣正版。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="theme-yi sk-body">
    <div id="menu" class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>三国志 · 九州涂色</h1>
          <p>游戏馆 · 致敬战略大地 · 单机群雄</p>
        </div>
        <a class="btn secondary" href="../../">返回游戏馆</a>
      </header>

      <section class="panel">
        <h2>190 年 · 群雄割据</h2>
        <p class="lead">
          宏图之上分布 <strong>46</strong> 座都市与约 <strong>340</strong> 处地区，并绘有汉末<strong>州界</strong>与<strong>山脉</strong>。部队行军涂色、围府夺城；武将拥有五维、特技与宝物。
          地图为自研示意；武将数值与头像来自项目组 R-C-Group 数据仓，机制致敬《三国志14》，不含光荣原作素材。
        </p>
        <h3>选择势力</h3>
        <div id="factionPick" class="faction-grid"></div>
        <p class="hint">操作：点选己城 → 勾选武将出征 → 在地图点目标进军/攻城 → 结束旬月。拖拽平移，滚轮缩放。</p>
      </section>
    </div>

    <div id="game" class="hidden">
      <div class="game-layout">
        <div class="map-wrap" id="mapWrap">
          <canvas id="map" width="960" height="560"></canvas>
          <div class="map-hud">
            <span class="chip" id="dateChip">190年1月</span>
            <span class="chip" id="landChip">领地 0</span>
            <span class="chip" id="cityChip">都市 0</span>
          </div>
        </div>
        <aside class="side">
          <div class="panel">
            <h3>势力</h3>
            <div class="meta">
              <span class="chip" id="factionChip">—</span>
              <span class="chip" id="goldChip">金 0</span>
              <span class="chip" id="foodChip">粮 0</span>
            </div>
            <p id="cityInfo" class="hint">点选己方都市</p>
          </div>
          <div class="panel">
            <h3>武将</h3>
            <div id="officerList" class="officer-list"></div>
            <div id="officerDetail" class="hidden">
              <div class="officer-hero">
                <img id="officerPortrait" class="officer-portrait" alt="" width="96" height="96" />
                <div>
                  <h4 id="officerName">—</h4>
                  <p id="officerBelong" class="hint belong"></p>
                  <div id="officerStats" class="stats"></div>
                </div>
              </div>
              <div id="officerTraits" class="traits"></div>
              <p id="officerRelations" class="hint relations"></p>
              <p id="officerDesc" class="hint"></p>
            </div>
            <div class="actions" style="margin-top: 0.55rem">
              <button class="btn" id="btnForm" type="button">出征（已选武将）</button>
              <button class="btn secondary" id="btnRecall" type="button">撤回部队</button>
              <button class="btn danger" id="btnEnd" type="button">结束旬月</button>
              <button class="btn secondary" id="btnMenu" type="button">返回选势</button>
            </div>
          </div>
          <div class="panel">
            <h3>军情</h3>
            <div id="battleLog"></div>
          </div>
        </aside>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="dialog-card">
        <h2 id="resultTitle">天下</h2>
        <p id="resultBody">—</p>
        <button class="btn" id="btnResultOk" type="button">确定</button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

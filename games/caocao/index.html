<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>曹操传 · 战棋演义 · 游戏馆</title>
    <meta
      name="description"
      content="网页版单机三国战棋：致敬光荣《三国志 曹操传》，原作全关卡/全剧本移植（自研素材），忠奸分歧。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="theme-yi caocao-body">
    <div id="menu" class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>曹操传 · 战棋演义</h1>
          <p>游戏馆 · 单机全剧本 · 致敬光荣战棋</p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="btnResetSave" type="button">重置进度</button>
          <a class="btn secondary" href="../../">返回游戏馆</a>
        </div>
      </header>

      <section class="panel">
        <h2>战役选择</h2>
        <p class="roadmap-note">
          单机全剧本（约 55 关）。战斗公式、兵种射程、地形消耗、计策与关卡脚本参考开源引擎
          <a href="https://github.com/wateret/mengde" target="_blank" rel="noopener">mengde</a>（MIT）；素材仍为自研。详见
          <code>ROADMAP.md</code>。
        </p>
        <div id="campaignMeta" class="meta campaign-meta"></div>
        <div id="stageList" class="stage-list"></div>
      </section>
    </div>

    <div id="battle" class="hidden">
      <div class="board-wrap">
        <canvas id="board" width="576" height="480"></canvas>
      </div>
      <aside class="side">
        <div class="panel">
          <h3>战况</h3>
          <div class="meta">
            <span class="chip" id="turnLabel">第 1 回合</span>
            <span class="chip" id="phaseLabel">我军阶段</span>
          </div>
          <p id="objective" style="margin: 0; font-size: 0.9rem; color: #3d2f26"></p>
        </div>
        <div class="panel">
          <h3>武将</h3>
          <div class="unit-card">
            <canvas id="portrait" width="96" height="112" aria-hidden="true"></canvas>
            <div>
              <p id="unitInfo" style="margin: 0; font-size: 0.9rem; line-height: 1.5; white-space: pre-line">—</p>
              <p id="tileInfo" style="margin: 0.45rem 0 0; font-size: 0.85rem; color: #5a4a3a">—</p>
            </div>
          </div>
        </div>
        <div class="panel actions" id="actionBar">
          <button class="btn" id="btnAttack" type="button">攻击</button>
          <button class="btn" id="btnMagic" type="button">计策</button>
          <button class="btn" id="btnWait" type="button">待机</button>
          <button class="btn secondary" id="btnCancel" type="button">取消</button>
          <button class="btn secondary" id="btnEndTurn" type="button">结束回合</button>
        </div>
        <div class="panel hidden" id="magicBar">
          <h3>计策</h3>
          <div id="magicList" class="magic-list"></div>
        </div>
        <div class="panel">
          <h3>战报</h3>
          <div id="battleLog"></div>
        </div>
        <button class="btn secondary" id="btnMenu" type="button">返回选关</button>
      </aside>
    </div>

    <div id="dialog" class="overlay hidden">
      <div class="dialog-card">
        <div class="speaker" id="dialogSpeaker">—</div>
        <p id="dialogText">—</p>
        <div id="dialogChoices" class="dialog-choices hidden"></div>
        <button class="btn" id="dialogNext" type="button">下一句</button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="result-card">
        <h2 id="resultTitle">胜利</h2>
        <p id="resultBody">—</p>
        <button class="btn" id="btnResultOk" type="button">确定</button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

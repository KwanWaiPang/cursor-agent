<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>红帽奇遇 · 游戏馆</title>
    <meta
      name="description"
      content="红帽奇遇：网页平台跳跃。原创像素关卡，致敬超级马里奥式跑跳顶砖，非任天堂产品。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/game-page.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235c94fc'/%3E%3Ccircle cx='32' cy='22' r='10' fill='%23e52521'/%3E%3Crect x='22' y='30' width='20' height='18' rx='4' fill='%233d73c8'/%3E%3C/svg%3E"
    />
  </head>
  <body class="theme-yi game-page redcap-page">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <a href="../../"><h1>红帽奇遇</h1></a>
          <p>网页平台跳跃 · 向 NES 超级马里奥手感致敬 · 非任天堂产品</p>
        </div>
        <div class="topbar-actions">
          <a class="btn secondary" href="../../">返回游戏馆</a>
        </div>
      </header>
      <main>
        <div class="canvas-wrap">
          <canvas id="game" width="256" height="240"></canvas>
        </div>
        <p class="help redcap-help">
          方向 / WASD 移动 · 空格 / Z / K 跳跃（按住跳得更高）· X / Shift 冲刺（喷火帽可喷火）· 下蹲。<br />
          顶问号砖、踩怪连击、踢龟壳、蘑菇变大、火花喷火、旗杆高度计分。镜头只向右滚，和早期超级马里奥一样。原创像素，非官方作品。
        </p>
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>红帽奇遇 · 游戏馆</title>
    <meta
      name="description"
      content="红帽奇遇：网页平台跳跃。原创像素关卡，致敬超级马里奥式跑跳顶砖，非任天堂产品。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/game-page.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235c94fc'/%3E%3Ccircle cx='32' cy='22' r='10' fill='%23e52521'/%3E%3Crect x='22' y='30' width='20' height='18' rx='4' fill='%233d73c8'/%3E%3C/svg%3E"
    />
  </head>
  <body class="theme-yi game-page redcap-page">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <a href="../../"><h1>红帽奇遇</h1></a>
          <p>网页平台跳跃 · 八关原创像素 · 非任天堂产品</p>
        </div>
        <div class="topbar-actions">
          <a class="btn secondary" href="../../">返回游戏馆</a>
        </div>
      </header>
      <main>
        <div class="canvas-wrap">
          <canvas id="game" width="256" height="240"></canvas>
        </div>
        <p class="help redcap-help">
          方向 / WASD 移动 · Z / 空格 / K 跳跃 · X / J / Shift 冲刺（喷火帽可喷火）· P / Esc 暂停。<br />
          手机：左下左右走，右下跳，旁圆冲刺。顶砖、踩怪、踢龟壳、吃蘑菇 / 火花 / 星星。素材与关卡均为原创程序像素，玩法向经典平台跳跃致敬。
        </p>
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>军棋 · 游戏馆</title>
    <meta
      name="description"
      content="网页版二人军棋：本地 AI 对战，暗棋交锋、铁路机动、夺旗获胜。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/game-page.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="theme-yi game-page">
    <audio id="clickAudio" src="../../assets/audio/click.wav" preload="auto"></audio>
    <audio id="selectAudio" src="../../assets/audio/select.wav" preload="auto"></audio>
    <div class="app shell">
      <header class="topbar">
        <div class="brand">
          <a href="../../"><h1>军棋</h1></a>
          <p>游戏馆 · 二人军棋 · 人机对战</p>
        </div>
        <div class="topbar-actions">
          <a class="btn secondary" href="../../">返回游戏馆</a>
        </div>
      </header>

      <main class="layout">
        <section class="board-wrap" aria-label="军棋棋盘">
          <canvas id="board" width="520" height="900" role="img" aria-label="军棋棋盘"></canvas>
          <div class="legend">
            <div>红方：你（南）· 蓝方：AI（北）· 「？」为未亮明敌子</div>
            <div>绿圆：行营（不可被攻）· 灰轨：铁路 · 红框：大本营</div>
          </div>
        </section>

        <aside class="panel">
          <section class="card">
            <h2>局势</h2>
            <div id="turnLabel" class="badge">布阵阶段</div>
            <div id="message" class="message">准备布阵</div>
            <div id="result" class="result-banner"></div>
          </section>

          <section class="card">
            <h2>操作</h2>
            <div class="controls">
              <button id="btnRedeploy" class="secondary" type="button">打乱重排</button>
              <button id="btnStart" type="button">开始作战</button>
              <button id="btnResign" class="danger" type="button">认输</button>
              <button id="btnNew" class="secondary" type="button">新对局</button>
            </div>
          </section>

          <section class="card">
            <h2>交战记录</h2>
            <div id="combatLog" class="combat-log">尚无交锋</div>
          </section>

          <section class="card">
            <h2>规则摘要</h2>
            <p class="hint" style="margin: 0; font-size: 0.85rem; line-height: 1.5; opacity: 0.8">
              大子吃小子；同级同归于尽。炸弹与碰者同灭；地雷仅工兵可排。
              军旗置于大本营，被吃即负。行营内不受攻击。铁路可滑行。
            </p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>

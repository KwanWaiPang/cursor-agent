<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>军棋 · 游戏馆</title>
    <meta
      name="description"
      content="网页版二人军棋暗棋：仅人机对决，棋子立起、铁路公路、行营大本营。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/game-page.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="theme-yi game-page">
    <audio id="clickAudio" src="../../assets/audio/click.wav" preload="auto"></audio>
    <audio id="selectAudio" src="../../assets/audio/select.wav" preload="auto"></audio>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <a href="../../"><h1>军棋</h1></a>
          <p>游戏馆 · 二人军棋暗棋 · 仅人机对决</p>
        </div>
        <div class="topbar-actions">
          <a class="btn secondary" href="../../">返回游戏馆</a>
        </div>
      </header>

      <main class="layout">
        <section class="board-wrap" aria-label="军棋棋盘">
          <canvas id="board" width="460" height="874" role="img" aria-label="军棋棋盘"></canvas>
        </section>

        <aside class="panel">
          <section class="card">
            <h2>局势</h2>
            <div class="status-row">
              <div class="turn">
                <span class="side-dot south" aria-hidden="true"></span>
                <span id="turnLabel">南方（你）行动</span>
              </div>
              <span id="phaseBadge" class="badge">对局中</span>
            </div>
            <div class="meta">
              <div>红方：你（南）· 蓝方：AI（北）· 暗棋立起</div>
              <div>蓝点可走 · 红点可攻 · 双红圈为行营</div>
            </div>
            <div id="message" class="message info">点己方棋子开始行动</div>
            <div id="result" class="result-banner"></div>
          </section>

          <section class="card">
            <h2>操作</h2>
            <div class="controls">
              <button id="btnRedeploy" class="secondary" type="button">打乱重排</button>
              <button id="btnStart" type="button">提示操作</button>
              <button id="btnResign" class="danger" type="button">认输</button>
            </div>
          </section>

          <section class="card">
            <h2>新对局</h2>
            <p class="hint">开局即战。先点红方棋子，再点高亮目标格。</p>
            <div class="controls" style="grid-template-columns: 1fr">
              <button id="btnNew" type="button">开始新对局</button>
            </div>
          </section>

          <section class="card">
            <h2>交战记录</h2>
            <div id="combatLog" class="combat-log">尚无交锋</div>
          </section>

          <section class="card">
            <h2>规则说明</h2>
            <ul class="help">
              <li>棋纸：兵站 / 行营（双红圈）/ 大本营；虚线框为铁路。</li>
              <li>公路一步；铁路直线滑行；工兵铁路可拐弯。</li>
              <li>前线可走左中右三路与斜线；行营内不受攻击。</li>
              <li>大本营棋子不可动；暗棋立起，交锋只见胜负、不亮敌子；司令阵亡亮旗。</li>
            </ul>
          </section>
        </aside>
      </main>

      <p class="footer-note">游戏馆 · 军棋（暗棋 · 人机）</p>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>

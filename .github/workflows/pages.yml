name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            games/street-duty/package-lock.json
            games/pocket/package-lock.json

      - name: Build street-duty
        working-directory: games/street-duty
        run: |
          npm ci
          npm run build
          # Guard: production index must reference hashed assets, not /src/main.js
          grep -q './assets/' index.html
          ls assets/*.js >/dev/null

      - name: Build pocket adventure (FP3D)
        working-directory: games/pocket
        run: |
          npm ci
          npm run build
          grep -q './assets/' index.html
          ls assets/*.js >/dev/null
          # Vendored GLBs must be synced to models/ for Pages
          test -f models/pokemon/regular/25.glb
          test "$(ls models/pokemon/regular/*.glb | wc -l)" -ge 151

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html .nojekyll README.md ARCHITECTURE.md THIRD_PARTY_NOTICES.md _site/
          cp -r css games assets _site/
          # 街战突击：发布同步后的构建（index.html + assets/），去掉源码树
          # （仓库 Pages 当前为 legacy/branch 部署时，main 上的同内容也会生效）
          rm -rf _site/games/street-duty/src \
                 _site/games/street-duty/tools \
                 _site/games/street-duty/node_modules \
                 _site/games/street-duty/dist \
                 _site/games/street-duty/*.md \
                 _site/games/street-duty/package.json \
                 _site/games/street-duty/package-lock.json \
                 _site/games/street-duty/vite.config.js \
                 _site/games/street-duty/index.source.html \
                 _site/games/street-duty/prompt.md \
                 _site/games/street-duty/ARCHITECTURE.md
          # 口袋冒险 FP3D：同样只保留构建产物
          rm -rf _site/games/pocket/src \
                 _site/games/pocket/tools \
                 _site/games/pocket/tests \
                 _site/games/pocket/node_modules \
                 _site/games/pocket/dist \
                 _site/games/pocket/public \
                 _site/games/pocket/shots \
                 _site/games/pocket/*.md \
                 _site/games/pocket/package.json \
                 _site/games/pocket/package-lock.json \
                 _site/games/pocket/vite.config.ts \
                 _site/games/pocket/tsconfig.json \
                 _site/games/pocket/index.source.html \
                 _site/games/pocket/viewer.html \
                 _site/games/pocket/PROMPT.md \
                 _site/games/pocket/ART_DIRECTION.md \
                 _site/games/pocket/CONTRIBUTING.md
          # GLBs are published from synced models/ (built from public/)
          test -f _site/games/pocket/models/pokemon/regular/1.glb
          # 不部署测试文件与超大源文件
          find _site -name '*.test.js' -delete
          find _site -name '*.blend' -delete
          find _site -name '*.map' -delete
          find _site -path '*/3D/fbx/*' -delete 2>/dev/null || true
          grep -q './assets/' _site/games/street-duty/index.html
          grep -q './assets/' _site/games/pocket/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

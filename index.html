<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏馆 · 网页小游戏集合</title>
    <meta
      name="description"
      content="游戏馆：围棋、中国象棋、3D 国际象棋、3D 战术射击。统一入口的网页游戏集合。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/shared.css" />
    <link rel="stylesheet" href="./css/hub.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c48a3a'/%3E%3Ccircle cx='24' cy='32' r='10' fill='%231a1a1a'/%3E%3Ccircle cx='42' cy='32' r='10' fill='%23f7f1e6' stroke='%23333' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body class="theme-yi">
    <main class="shell">
      <header class="hub-hero">
        <h1>游戏馆</h1>
        <p>一馆多玩。棋类对弈与战术射击，开局即战，无需安装。</p>
      </header>

      <section class="game-grid" aria-label="游戏列表">
        <a class="game-card" href="./games/go/">
          <div class="mark">围</div>
          <h2>围棋</h2>
          <p>中国规则，人人对战 / 本地 AI，支持 9·13·19 路与自动点目。</p>
          <span class="cta">进入对局 →</span>
        </a>

        <a class="game-card" href="./games/xiangqi/">
          <div class="mark">象</div>
          <h2>中国象棋</h2>
          <p>经典楚河汉界。人机对弈与残局挑战，浏览器本地运行。</p>
          <span class="cta">进入对局 →</span>
        </a>

        <a class="game-card" href="./games/chess3d/">
          <div class="mark">国</div>
          <h2>国际象棋 · 3D</h2>
          <p>WebGL 立体棋盘，可与 AI 对弈，支持悔棋与视角环绕。</p>
          <span class="cta">进入对局 →</span>
        </a>

        <a class="game-card game-card-fps" href="./games/fps/">
          <div class="mark">战</div>
          <h2>战术突击 · 3D</h2>
          <p>写实军事风第一人称射击：据点清剿与迷你大逃杀，本地 AI，无血腥。</p>
          <span class="cta">进入战场 →</span>
        </a>
      </section>

      <p class="footer-note">纯前端运行 · 可部署至 GitHub Pages</p>
    </main>
  </body>
</html>
